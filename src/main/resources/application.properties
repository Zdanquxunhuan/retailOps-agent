spring.application.name=RetailOps-Agent
server.address=127.0.0.1
server.port=8080
server.error.include-message=never
server.error.include-stacktrace=never
spring.config.import=optional:file:./config/application-local.yml

spring.ai.model.chat=deepseek
spring.ai.deepseek.api-key=${DEEPSEEK_API_KEY}
spring.ai.deepseek.chat.model=${DEEPSEEK_MODEL:deepseek-chat}
spring.ai.deepseek.chat.temperature=0
spring.ai.deepseek.chat.max-tokens=300
spring.ai.retry.max-attempts=1
spring.http.client.connect-timeout=5s
spring.http.client.read-timeout=30s

retailops.data-directory=./data/diagnoses
retailops.max-concurrent-diagnoses=2

# No request/response body logging. The external SDK can include signatures in exceptions.
logging.level.com.zaxxer.hikari=OFF
logging.level.com.microsoft.sqlserver.jdbc=OFF

# Version 2: only administrator-configured local evidence sources; no remote log commands.
retailops.diagnostics.logs.enabled=false
retailops.diagnostics.logs.directory=./data/logs/meituan
retailops.diagnostics.logs.file-glob=*.log
retailops.diagnostics.logs.charset=UTF-8
retailops.diagnostics.logs.max-files=20
retailops.diagnostics.logs.max-bytes=20971520
retailops.diagnostics.logs.max-line-bytes=16384
retailops.diagnostics.logs.max-matches=20
retailops.diagnostics.logs.timeout-millis=3000
retailops.diagnostics.knowledge.enabled=true
retailops.diagnostics.knowledge.location=classpath:knowledge/meituan-sales.json
retailops.diagnostics.knowledge.max-entries=100
retailops.diagnostics.knowledge.top-k=3
# Opt in after reviewing the approved SOP text; this adds a second DeepSeek call.
retailops.diagnostics.explanation-enabled=false
