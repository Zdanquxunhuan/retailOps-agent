# Copy to application-local.yml (ignored by Git). Fill real values locally; never commit secrets.
retailops:
  meituan:
    sdk-jar: 'E:/Repositories/Maven/cn/com/baby/shangou-platform-open-sdk/1.0.27.1-SNAPSHOT/shangou-platform-open-sdk-1.0.27.1-SNAPSHOT.jar'
    sdk-config-directory: './config/meituan-sdk'
    app-id: '${MEITUAN_APP_ID}'
    app-secret: '${MEITUAN_APP_SECRET}'
  users:
    operator:
      # A real BCrypt hash prefixed with {bcrypt}; no plaintext fallback or default password.
      password-hash: '${RETAILOPS_OPERATOR_PASSWORD_HASH}'
      stores:
        - 'REPLACE_WITH_ACTUAL_APP_POI_CODE'
  pos-routes:
    # Exact Meituan app_poi_code. Values are administrator configuration, never model input.
    '[REPLACE_WITH_ACTUAL_APP_POI_CODE]':
      jdbc-url: '${POS_JDBC_URL}'
      username: '${POS_READ_USERNAME}'
      password: '${POS_READ_PASSWORD}'
      schema: 'dbo'
      query-timeout-seconds: 5
  diagnostics:
    logs:
      enabled: false
      # Local read-only copy/mount of approved log files. No SSH or production log collection.
      directory: './data/logs/meituan'
      file-glob: '*.log'
      charset: 'UTF-8'
    knowledge:
      enabled: true
      # Reviewed generic operational SOP, contains no real orders or customer data.
      location: 'classpath:knowledge/meituan-sales.json'
    explanation-enabled: false

  agent:
    enabled: true
    planner-enabled: true
    remote-logs:
      enabled: false
      # Enable only after applying the server restrictions documented in docs/version3/security.md.
      host: '${RETAILOPS_LOG_HOST:}'
      port: 22
      username: 'retailops_logs'
      private-key: '${RETAILOPS_LOG_PRIVATE_KEY:./config/ssh/retailops_logs_key}'
      known-hosts: '${RETAILOPS_LOG_KNOWN_HOSTS:./config/ssh/known_hosts}'
      # Inside chroot: read-only bind mount of /data/service/b-push-center-server/logs.
      directory: '/logs'
      zone-id: 'Asia/Shanghai'
      charset: 'UTF-8'
      # Exact literal confirmed against real callback logger source; leave empty if unconfirmed.
      callback-received-marker: ''
